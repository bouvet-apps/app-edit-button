kind: "CMS"
form:
  - type: "FieldSet"
    label:
      text: "Edit button"
      i18n: "edit.label"
    items:
      - type: "RadioButton"
        name: "position"
        label:
          text: "Position"
          i18n: "edit.position"
        occurrences:
          min: 1
          max: 1
        options:
          - value: "top-left"
            label:
              text: "Top left"
              i18n: "edit.position.top-left"
          - value: "top-right"
            label:
              text: "Top right"
              i18n: "edit.position.top-right"
          - value: "bottom-left"
            label:
              text: "Bottom left"
              i18n: "edit.position.bottom-left"
          - value: "bottom-right"
            label:
              text: "Bottom right"
              i18n: "edit.position.bottom-right"
        default: "top-left"
      - type: "RadioButton"
        name: "size"
        label:
          text: "Button size"
          i18n: "edit.button"
        occurrences:
          min: 1
          max: 1
        options:
          - value: "large"
            label:
              text: "Large"
              i18n: "edit.button.large"
          - value: "small"
            label:
              text: "Small"
              i18n: "edit.button.small"
        default: "large"
